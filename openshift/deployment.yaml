apiVersion: apps/v1
kind: Deployment
metadata:
  name: srm-credit-engine
  labels:
    app.kubernetes.io/name: srm-credit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srm-credit-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srm-credit-engine
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/srm-credit-engine/srm-credit-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: srm-credit-engine-config
            - secretRef:
                name: srm-credit-engine-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
